name: Build and publish

# Every push to main builds every addon for every release in releases.conf. An addon whose
# version has no release yet gets one (tag <release>/<id>-<version>, zip attached), and the
# Kodi repository - per release addons.xml, its md5 and the current zips - is deployed to
# GitHub Pages. Nothing built is committed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # also started by follow-upstream.yml after it moves a pin

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      unreleased: ${{ steps.versions.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version check diffs against release tags

      - name: Install TexturePacker build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cmake liblzo2-dev libpng-dev libgif-dev libjpeg-dev

      - uses: actions/cache@v4
        with:
          path: .cache
          key: upstream-${{ hashFiles('forks/*/*.pin') }}
          restore-keys: upstream-

      - name: Build repository
        run: ./build.sh dist

      - name: Validate assembled addons
        run: |
          find build -name '*.xml' -print0 | xargs -0 -r xmllint --noout
          find build -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Check version bumps
        id: versions
        run: |
          unreleased="$(scripts/check-versions.sh)"
          echo "$unreleased"
          { echo 'unreleased<<EOF'; echo "$unreleased"; echo EOF; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.unreleased != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          UNRELEASED: ${{ needs.build.outputs.unreleased }}
        run: |
          mkdir dist && tar -xf pages/artifact.tar -C dist
          . scripts/lib.sh
          while read -r release addon_id version; do
            [ -n "$addon_id" ] || continue
            tag="$(release_tag "$release" "$addon_id" "$version")"
            mapfile -t sources < <(addon_sources "$release" "$addon_id")
            upstream=""
            if [ -d "forks/$addon_id" ]; then
              load_fork "$addon_id" "$release"
              upstream="Upstream: $UPSTREAM_REPO@$PIN $UPSTREAM_PATH, with the patches in ${PATCH_DIR#$ROOT/}."
            fi
            prev="$(git tag --list "$(release_tag "$release" "$addon_id" '*')" --sort=-creatordate | head -1)"
            if [ -n "$prev" ]; then
              notes="$(git log --format='- %s' "$prev..HEAD" -- "${sources[@]}")"
            else
              notes="First release."
            fi
            gh release create "$tag" "dist/$release/$addon_id/${addon_id}-${version}.zip" \
              --target "$GITHUB_SHA" --title "$addon_id $version ($release)" \
              --notes "${notes:-No changes recorded.}${upstream:+$'\n\n'$upstream}"
          done <<< "$UNRELEASED"

  pages:
    needs: [build, release]
    if: always() && needs.build.result == 'success' && needs.release.result != 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
